name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# 배포가 겹치지 않게 한 번에 하나씩
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # 고정 배포 키 복원 (시크릿이 없으면 건너뛰고 디버그 키로 서명)
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "고정 배포 키로 서명합니다."
          else
            echo "::warning::SIGNING_KEYSTORE_BASE64 시크릿이 없어 디버그 키로 서명합니다. 이 경우 업데이트 설치가 실패할 수 있습니다."
          fi

      - name: Test, lint, build
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintRelease assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk WinTrackpad.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WinTrackpad-apk
          path: WinTrackpad.apk

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          path: app/build/reports

      # main 푸시마다 버전별 릴리스를 새로 만든다. 기존 릴리스는 지우지 않으며,
      # releases/latest 는 GitHub가 자동으로 가장 최근 릴리스를 가리킨다.
      - name: Publish release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.1.${VERSION_CODE}"
          gh release create "$TAG" WinTrackpad.apk \
            --title "WinTrackpad $TAG" \
            --notes "폰에서 WinTrackpad.apk를 받아 설치하세요. 커밋: ${GITHUB_SHA::7}" \
            --target "$GITHUB_SHA" \
            --latest
